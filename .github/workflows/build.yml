name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias de Android SDK
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK debug
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Reportar log a anotaciones
        if: always()
        run: |
          tail -n 25 build.log | while IFS= read -r line; do
            echo "::notice title=Gradle::$line"
          done
          find app -name "*.apk" | while IFS= read -r f; do
            echo "::notice title=APK::$f"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sleepsync-apk
          path: '**/*.apk'
          if-no-files-found: error
